<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Entrep Fair - Receipt Generator</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2024.1.1/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2024.1.1/core.js">
    </script>

</head>


<body>

    <nav>

        <a href="index.html" class="active">
            Receipt Generator
        </a>

        <a href="sku.html">
            SKU Generator
        </a>

    </nav>


    <main class="container">

        <section class="hero">

            <p class="eyebrow">
                ENTREP FAIR
            </p>

            <h1>
                NOEMAYR-1Q Project
            </h1>

            <p>
                Create a simple receipt and calculate the 12% VAT.
            </p>

        </section>


        <section class="card">

            <h2>
                Select Products
            </h2>


            <label class="product">

                <input
                    type="checkbox"
                    id="item1"
                    value="80"
                >

                <span>
                    Americano
                </span>

                <strong>
                    ₱80.00
                </strong>

            </label>


            <label class="product">

                <input
                    type="checkbox"
                    id="item2"
                    value="95"
                >

                <span>
                    Spanish Latte
                </span>

                <strong>
                    ₱95.00
                </strong>

            </label>


            <label class="product">

                <input
                    type="checkbox"
                    id="item3"
                    value="70"
                >

                <span>
                    Iced Tea
                </span>

                <strong>
                    ₱70.00
                </strong>

            </label>


            <label class="product">

                <input
                    type="checkbox"
                    id="item4"
                    value="100"
                >

                <span>
                    Cold Brew
                </span>

                <strong>
                    ₱100.00
                </strong>

            </label>


            <label class="product">

                <input
                    type="checkbox"
                    id="item5"
                    value="110"
                >

                <span>
                    Caramel Macchiato
                </span>

                <strong>
                    ₱110.00
                </strong>

            </label>


            <button
                type="button"
                py-click="create_order">

                Create Order

            </button>

        </section>


        <section class="card">

            <h2>
                Order Summary
            </h2>

            <div
                id="show"
                class="output">

                <p>
                    Select your products, then click
                    <b>Create Order</b>.
                </p>

            </div>

        </section>

    </main>


    <script
        type="py"
        src="main.py">
    </script>

</body>

</html>
